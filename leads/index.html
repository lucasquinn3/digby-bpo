e:13px; font-weight:800; letter-spacing:0.08em; color:#14243d\">{{ labReport }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ goSync }}\" style=\"border:0; background:transparent; padding:0; cursor:pointer; font-size:13px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">SYNC<\u002Fbutton>\n      <a href=\"Leasing.dc.html\" style=\"margin-left:auto; font-size:13px; font-weight:800; letter-spacing:0.08em; text-decoration:none\">LEASING →<\u002Fa>\n      <a href=\"BPO Report.dc.html\" style=\"font-size:13px; font-weight:800; letter-spacing:0.08em; text-decoration:none\">VALUATION →<\u002Fa>\n    <\u002Fnav>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:0; border-bottom:2px solid #14243d\">\n      <sc-for list=\"{{ kpis }}\" as=\"k\" hint-placeholder-count=\"5\">\n        <div style=\"padding:22px 22px 24px 0\">\n          <div style=\"font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; min-height:2.9em\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:40px; font-weight:800; letter-spacing:-0.03em; font-variant-numeric:tabular-nums; line-height:1.1\">{{ k.value }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#5b6675\">{{ k.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <div style=\"font-size:12.5px; color:#7b8798; padding:16px 0 6px\">{{ homeNote }}<\u002Fdiv>\n\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:2px; background:#d5dce4; border:1px solid #d5dce4\">\n      <sc-for list=\"{{ cards }}\" as=\"c\" hint-placeholder-count=\"7\">\n        <article data-card=\"1\" sc-camel-on-click=\"{{ c.onClick }}\" style=\"background:#f5f7f9; padding:22px; cursor:pointer; display:flex; flex-direction:column; gap:14px\">\n          <div>\n            <div style=\"display:flex; gap:10px; align-items:baseline; flex-wrap:wrap\">\n              <div style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; color:#2f6fad\">{{ c.deal }}<\u002Fdiv>\n              <div style=\"font-size:11px; font-weight:700; letter-spacing:0.06em; color:#7b8798\">{{ c.price }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"font-size:19px; font-weight:800; letter-spacing:-0.02em; padding-top:4px\">{{ c.name }}<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:#5b6675\">{{ c.city }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex; align-items:flex-end; gap:4px; height:46px\">\n            <sc-for list=\"{{ c.bars }}\" as=\"b\" hint-placeholder-count=\"10\">\n              <div title=\"{{ b.title }}\" style=\"flex:1; min-width:5px; background:{{ b.color }}; height:{{ b.h }}px\"><\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"display:flex; gap:22px; border-top:1px solid #d5dce4; padding-top:12px\">\n            <div>\n              <div style=\"font-size:10.5px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">TOUCHES<\u002Fdiv>\n              <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em\">{{ c.total }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10.5px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">THIS WEEK<\u002Fdiv>\n              <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em\">{{ c.week }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div>\n              <div style=\"font-size:10.5px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">HOT<\u002Fdiv>\n              <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em; color:#ec3013\">{{ c.hot }}<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-left:auto; text-align:right\">\n              <div style=\"font-size:10.5px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">TO WORK<\u002Fdiv>\n              <div style=\"font-size:22px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-0.02em\">{{ c.open }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Farticle>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isProp }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:22px 0 20px; border-bottom:2px solid #14243d\">\n      <button data-noprint=\"1\" sc-camel-on-click=\"{{ goHome }}\" style=\"border:0; background:transparent; padding:0 0 12px; cursor:pointer; font-size:12.5px; font-weight:800; letter-spacing:0.06em; color:#2f6fad\">← ALL PROPERTIES<\u002Fbutton>\n      <div style=\"display:flex; gap:14px; align-items:baseline; flex-wrap:wrap\">\n        <div style=\"font-size:11px; font-weight:800; letter-spacing:0.1em; color:#2f6fad\">{{ pDeal }}<\u002Fdiv>\n        <div style=\"font-size:34px; font-weight:800; letter-spacing:-0.03em\">{{ pName }}<\u002Fdiv>\n        <div style=\"font-size:14px; color:#5b6675\">{{ pCity }}<\u002Fdiv>\n        <div style=\"margin-left:auto; font-size:20px; font-weight:800; letter-spacing:-0.02em\">{{ pPrice }}<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; gap:12px; flex-wrap:wrap; padding-top:14px\" data-noprint=\"1\">\n        <a href=\"{{ pBrochure }}\" target=\"_blank\" style=\"border:1px solid color-mix(in srgb,#14243d 40%,transparent); color:#14243d; font-weight:800; font-size:12.5px; padding:9px 14px; text-decoration:none\">{{ pBrochureLabel }}<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0; border-bottom:1px solid #d5dce4\">\n      <sc-for list=\"{{ pKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"padding:20px 20px 22px 0\">\n          <div style=\"font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:32px; font-weight:800; letter-spacing:-0.03em; font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#5b6675\">{{ k.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <div style=\"font-size:12.5px; color:#7b8798; padding:18px 0 12px\" data-noprint=\"1\">{{ pCount }} · drag a row onto another heading to move it<\u002Fdiv>\n\n    <div style=\"padding-bottom:40px\">\n      <sc-for list=\"{{ board }}\" as=\"col\" hint-placeholder-count=\"6\">\n        <section sc-camel-on-drag-over=\"{{ col.onDragOver }}\" sc-camel-on-drop=\"{{ col.onDrop }}\" style=\"margin-bottom:26px\">\n          <div style=\"display:flex; align-items:baseline; gap:12px; border-bottom:2px solid #14243d; padding:0 0 8px\">\n            <div style=\"font-size:12px; font-weight:800; letter-spacing:0.09em; color:{{ col.color }}\">{{ col.label }}<\u002Fdiv>\n            <div style=\"font-size:16px; font-weight:800; font-variant-numeric:tabular-nums\">{{ col.count }}<\u002Fdiv>\n            <div style=\"margin-left:auto; font-size:11.5px; color:#7b8798\" data-noprint=\"1\">{{ col.hint }}<\u002Fdiv>\n          <\u002Fdiv>\n          <sc-for list=\"{{ col.cards }}\" as=\"l\" hint-placeholder-count=\"3\">\n            <article draggable=\"true\" sc-camel-on-drag-start=\"{{ l.onDragStart }}\" sc-camel-on-drag-end=\"{{ l.onDragEnd }}\" style=\"border-bottom:1px solid #e2e7ed; background:{{ col.bg }}; padding:13px 12px 13px 0; cursor:grab; display:grid; grid-template-columns:16px minmax(140px,1fr) minmax(95px,0.6fr) minmax(160px,1fr) minmax(190px,1.5fr) auto; gap:14px; align-items:center\">\n              <div style=\"font-size:15px; color:#b9c4d0; line-height:1\" data-noprint=\"1\">⠿<\u002Fdiv>\n              <div>\n                <button sc-camel-on-click=\"{{ l.onOpen }}\" style=\"border:0; background:transparent; padding:0; cursor:pointer; font-size:15px; font-weight:800; letter-spacing:-0.01em; color:#14243d; text-align:left\" style-hover=\"color:#ec3013\">{{ l.n }}<\u002Fbutton>\n                <div style=\"font-size:11.5px; color:#7b8798\">{{ l.w }} · {{ l.s }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div style=\"font-size:12.5px; font-weight:700; color:{{ l.aColor }}\">{{ l.a }}<\u002Fdiv>\n              <div style=\"font-size:12.5px; line-height:1.5\">\n                <a href=\"{{ l.mailto }}\" style=\"font-weight:600; word-break:break-all\">{{ l.e }}<\u002Fa>\n                <div style=\"color:#5b6675\">{{ l.ph }}<\u002Fdiv>\n              <\u002Fdiv>\n              <div>\n                <div style=\"font-size:12.5px; color:#5b6675; font-style:italic; padding-bottom:6px\">{{ l.m }}<\u002Fdiv>\n                <input value=\"{{ l.note }}\" sc-camel-on-change=\"{{ l.onNote }}\" placeholder=\"what I did\" style=\"width:100%; box-sizing:border-box; border:1px solid #dde3ea; background:#fff; padding:6px 8px; font-size:12px\" data-noprint=\"1\">\n              <\u002Fdiv>\n              <div style=\"display:flex; gap:8px; align-items:center\" data-noprint=\"1\">\n                <sc-if value=\"{{ l.hasBrochure }}\" hint-placeholder-val=\"{{ true }}\">\n                  <button sc-camel-on-click=\"{{ l.sendBrochure }}\" style=\"border:0; background:#2f6fad; color:#f5f7f9; font-weight:800; font-size:11px; letter-spacing:0.04em; padding:8px 11px; cursor:pointer; text-align:left; white-space:nowrap\">SEND BROCHURE<\u002Fbutton>\n                <\u002Fsc-if>\n                <a href=\"{{ l.tel }}\" style=\"border:1px solid #cfd7e0; color:#14243d; font-weight:800; font-size:11px; letter-spacing:0.04em; padding:7px 11px; text-decoration:none\">CALL<\u002Fa>\n                <sc-raw-select value=\"{{ l.status }}\" sc-camel-on-change=\"{{ l.onStatus }}\" style=\"border:1px solid #cfd7e0; background:#fff; padding:7px 8px; font-size:11.5px\">\n                  <sc-for list=\"{{ stageOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n                    <option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption>\n                  <\u002Fsc-for>\n                <\u002Fsc-raw-select>\n              <\u002Fdiv>\n            <\u002Farticle>\n          <\u002Fsc-for>\n          <sc-if value=\"{{ col.empty }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"font-size:12.5px; color:#a3adb9; padding:16px 0; border-bottom:1px solid #e2e7ed\">Nothing here — drag a name down, or set it from the dropdown.<\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isLead }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:22px 0 20px; border-bottom:2px solid #14243d\">\n      <button data-noprint=\"1\" sc-camel-on-click=\"{{ goBack }}\" style=\"border:0; background:transparent; padding:0 0 12px; cursor:pointer; font-size:12.5px; font-weight:800; letter-spacing:0.06em; color:#2f6fad\">{{ leadBack }}<\u002Fbutton>\n      <div style=\"display:flex; gap:18px; align-items:baseline; flex-wrap:wrap\">\n        <div style=\"font-size:34px; font-weight:800; letter-spacing:-0.03em\">{{ leadName }}<\u002Fdiv>\n        <a href=\"{{ leadMail }}\" style=\"font-size:14px; font-weight:600\">{{ leadEmail }}<\u002Fa>\n        <a href=\"{{ leadTel }}\" style=\"font-size:14px; color:#5b6675; text-decoration:none\">{{ leadPhone }}<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0; border-bottom:1px solid #d5dce4\">\n      <sc-for list=\"{{ leadKpis }}\" as=\"k\" hint-placeholder-count=\"4\">\n        <div style=\"padding:20px 20px 22px 0\">\n          <div style=\"font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">{{ k.label }}<\u002Fdiv>\n          <div style=\"font-size:32px; font-weight:800; letter-spacing:-0.03em; font-variant-numeric:tabular-nums\">{{ k.value }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; color:#5b6675\">{{ k.sub }}<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"padding:24px 0 8px\">\n      <div style=\"font-size:12px; font-weight:800; letter-spacing:0.09em; color:#7b8798; padding-bottom:10px\">LISTINGS THEY LOOKED AT<\u002Fdiv>\n      <sc-for list=\"{{ leadListings }}\" as=\"p\" hint-placeholder-count=\"2\">\n        <div style=\"border-bottom:1px solid #e2e7ed; padding:12px 0; display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,0.6fr) auto; gap:16px; align-items:center\">\n          <button sc-camel-on-click=\"{{ p.onProp }}\" style=\"border:0; background:transparent; padding:0; cursor:pointer; font-size:15px; font-weight:800; color:#14243d; text-align:left\" style-hover=\"color:#ec3013\">{{ p.name }} →<\u002Fbutton>\n          <div style=\"font-size:12.5px; color:#5b6675\">{{ p.n }}<\u002Fdiv>\n          <sc-raw-select value=\"{{ p.stage }}\" sc-camel-on-change=\"{{ p.onStatus }}\" style=\"border:1px solid #cfd7e0; background:#fff; padding:7px 8px; font-size:11.5px\" data-noprint=\"1\">\n            <sc-for list=\"{{ stageOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n              <option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption>\n            <\u002Fsc-for>\n          <\u002Fsc-raw-select>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n\n    <section style=\"padding:28px 0 60px\">\n      <div style=\"font-size:12px; font-weight:800; letter-spacing:0.09em; color:#7b8798; padding-bottom:4px\">EVERYTHING, NEWEST FIRST<\u002Fdiv>\n      <div data-noprint=\"1\" style=\"display:flex; gap:0; align-items:stretch; border:2px solid #14243d; margin:12px 0 8px\">\n        <input value=\"{{ draft }}\" sc-camel-on-change=\"{{ onDraft }}\" sc-camel-on-key-down=\"{{ onDraftKey }}\" placeholder=\"Log another update — call, voicemail, tour, whatever happened\" style=\"flex:1; border:0; padding:13px 14px; font-size:14px; font-family:inherit; outline:none; min-width:0\">\n        <button sc-camel-on-click=\"{{ onLogUpdate }}\" style=\"border:0; border-left:2px solid #14243d; background:#ec3013; color:#fff; padding:0 22px; cursor:pointer; font-size:12px; font-weight:800; letter-spacing:0.08em\" style-hover=\"background:#c62710\">ADD UPDATE<\u002Fbutton>\n      <\u002Fdiv>\n      <div data-noprint=\"1\" style=\"font-size:11.5px; color:#a3adb9; padding-bottom:8px\">Files under {{ draftAt }}. Nothing gets overwritten — every update stacks below.<\u002Fdiv>\n      <sc-if value=\"{{ leadEmpty }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px; color:#a3adb9; padding:16px 0\">Nothing on file for this name yet.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-for list=\"{{ leadTimeline }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <div style=\"display:grid; grid-template-columns:110px 1fr; gap:20px; padding:16px 0; border-bottom:1px solid #e2e7ed\">\n          <div>\n            <div style=\"font-size:13px; font-weight:800; font-variant-numeric:tabular-nums\">{{ t.when }}<\u002Fdiv>\n            <div style=\"font-size:10.5px; font-weight:800; letter-spacing:0.09em; color:{{ t.sideColor }}\">{{ t.side }}<\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"border-left:2px solid {{ t.rule }}; padding-left:16px\">\n            <div style=\"font-size:15px; font-weight:800; letter-spacing:-0.01em\">{{ t.title }}<\u002Fdiv>\n            <div style=\"font-size:12px; color:#7b8798; padding-top:2px\">{{ t.where }} {{ t.src }}<\u002Fdiv>\n            <div style=\"font-size:13px; color:#5b6675; padding-top:6px; max-width:76ch; text-wrap:pretty\">{{ t.body }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHot }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:20px 0; border-bottom:1px solid #d5dce4\">\n      <div style=\"font-size:13px; color:#5b6675; max-width:84ch\">Everyone who did more than look — requested information, sent a message, or clicked through to a phone or email — across all seven listings, newest first. Anything still marked New is unworked.<\u002Fdiv>\n    <\u002Fsection>\n    <div style=\"font-size:12.5px; color:#7b8798; padding:14px 0\">{{ hotCount }}<\u002Fdiv>\n    <sc-for list=\"{{ hotLeads }}\" as=\"l\" hint-placeholder-count=\"6\">\n      <article style=\"border-bottom:1px solid #e2e7ed; padding:18px 0; display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.6fr) auto; gap:20px; align-items:start\">\n        <div>\n          <button sc-camel-on-click=\"{{ l.onOpen }}\" style=\"border:0; background:transparent; padding:0; cursor:pointer; font-size:16px; font-weight:800; letter-spacing:-0.01em; color:#14243d; text-align:left\" style-hover=\"color:#ec3013\">{{ l.n }}<\u002Fbutton>\n          <div style=\"font-size:12.5px; color:#5b6675\">{{ l.w }} · {{ l.s }}<\u002Fdiv>\n          <div style=\"font-size:12.5px; font-weight:700; color:#ec3013\">{{ l.a }}<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px\">\n          <a href=\"{{ l.mailto }}\" style=\"font-weight:600\">{{ l.e }}<\u002Fa>\n          <div style=\"color:#5b6675\">{{ l.ph }}<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ l.onProp }}\" style=\"border:0; background:transparent; padding:6px 0 0; cursor:pointer; font-size:12.5px; font-weight:800; color:#2f6fad; text-align:left\">{{ l.pname }} →<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-size:12.5px; color:#5b6675\">{{ l.m }}<\u002Fdiv>\n        <sc-raw-select value=\"{{ l.status }}\" sc-camel-on-change=\"{{ l.onStatus }}\" style=\"border:1px solid #b9c4d0; background:#fff; padding:8px 10px; font-size:12.5px\">\n          <sc-for list=\"{{ stageOpts }}\" as=\"o\" hint-placeholder-count=\"6\">\n            <option value=\"{{ o.v }}\">{{ o.t }}<\u002Foption>\n          <\u002Fsc-for>\n        <\u002Fsc-raw-select>\n      <\u002Farticle>\n    <\u002Fsc-for>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isReport }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:20px 0; border-bottom:1px solid #d5dce4; display:flex; gap:12px; align-items:end; flex-wrap:wrap\" data-noprint=\"1\">\n      <label style=\"flex:1 1 260px\">\n        <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; margin-bottom:4px\">SEND TO<\u002Fspan>\n        <input value=\"{{ bossEmail }}\" sc-camel-on-change=\"{{ onBoss }}\" placeholder=\"tanner@digbycommercial.com\" style=\"width:100%; box-sizing:border-box; border:1px solid #b9c4d0; background:#fff; padding:10px 12px; font-size:14px\">\n      <\u002Flabel>\n      <button sc-camel-on-click=\"{{ openMail }}\" style=\"border:0; background:#2f6fad; color:#f5f7f9; font-weight:800; font-size:13px; padding:11px 18px; cursor:pointer; text-align:left\">OPEN IN MAIL<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ copyReport }}\" style=\"border:1px solid color-mix(in srgb,#14243d 40%,transparent); background:transparent; color:#14243d; font-weight:800; font-size:13px; padding:10px 16px; cursor:pointer; text-align:left\">{{ copyBtn }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ printPage }}\" style=\"border:1px solid color-mix(in srgb,#14243d 40%,transparent); background:transparent; color:#14243d; font-weight:800; font-size:13px; padding:10px 16px; cursor:pointer; text-align:left\">PRINT<\u002Fbutton>\n    <\u002Fsection>\n    <pre style=\"white-space:pre-wrap; font-family:'Archivo Narrow',ui-monospace,monospace; font-size:14px; line-height:1.62; padding:26px 0; margin:0; max-width:88ch\">{{ reportText }}<\u002Fpre>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isSync }}\" hint-placeholder-val=\"{{ false }}\">\n    <section style=\"padding:24px 0; max-width:78ch\">\n      <div style=\"font-size:13.5px; color:#5b6675; margin-bottom:20px\">Statuses and notes you type here sync through the same Supabase project and login as the valuation tool, in a table called <b>dash_state<\u002Fb>. The lead history itself ships inside the page and doesn't need a database. Run the SQL once, then sign in.<\u002Fdiv>\n      <div style=\"display:flex; gap:12px; flex-wrap:wrap; margin-bottom:22px\">\n        <button sc-camel-on-click=\"{{ copySql }}\" style=\"border:1px solid color-mix(in srgb,#14243d 40%,transparent); background:transparent; color:#14243d; font-weight:800; font-size:13px; padding:10px 16px; cursor:pointer; text-align:left\">{{ sqlBtn }}<\u002Fbutton>\n      <\u002Fdiv>\n      <sc-if value=\"{{ sbOff }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px 18px\">\n          <label style=\"display:block\">\n            <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; margin-bottom:4px\">PROJECT URL<\u002Fspan>\n            <input value=\"{{ sbUrl }}\" sc-camel-on-change=\"{{ onSbUrl }}\" placeholder=\"https://xxxx.supabase.co\" style=\"width:100%; box-sizing:border-box; border:1px solid #b9c4d0; padding:9px 11px; font-size:13.5px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; margin-bottom:4px\">ANON KEY<\u002Fspan>\n            <input value=\"{{ sbKey }}\" sc-camel-on-change=\"{{ onSbKey }}\" placeholder=\"eyJhbGci…\" style=\"width:100%; box-sizing:border-box; border:1px solid #b9c4d0; padding:9px 11px; font-size:13.5px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; margin-bottom:4px\">EMAIL<\u002Fspan>\n            <input value=\"{{ sbEmail }}\" sc-camel-on-change=\"{{ onSbEmail }}\" style=\"width:100%; box-sizing:border-box; border:1px solid #b9c4d0; padding:9px 11px; font-size:13.5px\">\n          <\u002Flabel>\n          <label style=\"display:block\">\n            <span style=\"display:block; font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798; margin-bottom:4px\">PASSWORD<\u002Fspan>\n            <input type=\"password\" value=\"{{ sbPass }}\" sc-camel-on-change=\"{{ onSbPass }}\" style=\"width:100%; box-sizing:border-box; border:1px solid #b9c4d0; padding:9px 11px; font-size:13.5px\">\n          <\u002Flabel>\n        <\u002Fdiv>\n        <button sc-camel-on-click=\"{{ sbSignIn }}\" style=\"border:0; background:#2f6fad; color:#f5f7f9; font-weight:800; font-size:13px; padding:11px 18px; cursor:pointer; margin-top:16px; text-align:left\">CONNECT<\u002Fbutton>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ sbOn }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"display:flex; gap:10px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ sbPushNow }}\" style=\"border:0; background:#2f6fad; color:#f5f7f9; font-weight:800; font-size:12.5px; padding:10px 14px; cursor:pointer; text-align:left\">SAVE UP NOW<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sbPullNow }}\" style=\"border:1px solid color-mix(in srgb,#14243d 40%,transparent); background:transparent; color:#14243d; font-weight:800; font-size:12.5px; padding:10px 14px; cursor:pointer; text-align:left\">PULL DOWN<\u002Fbutton>\n          <button sc-camel-on-click=\"{{ sbSignOut }}\" style=\"border:0; background:transparent; color:#7b8798; font-weight:700; font-size:12.5px; padding:10px 4px; cursor:pointer\">Disconnect<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div style=\"font-size:12.5px; color:#2f6fad; padding:16px 0\">{{ sbMsg }}<\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"padding:10px 0 40px; max-width:96ch; border-top:2px solid #14243d; margin-top:10px\">\n      <div style=\"font-size:15px; font-weight:800; letter-spacing:0.04em; padding:22px 0 6px\">LIVE FEED FROM OUTLOOK<\u002Fdiv>\n      <div style=\"font-size:13.5px; color:#5b6675; max-width:84ch\">Crexi and LoopNet email you every time somebody touches a listing. Point those emails at the table below and this board fills in through the day instead of once a week. The page checks for new ones every two minutes.<\u002Fdiv>\n      <div style=\"font-size:12.5px; font-weight:700; color:#2f6fad; padding:12px 0 22px\">{{ liveStatus }}<\u002Fdiv>\n\n      <ol style=\"margin:0; padding:0 0 0 22px; font-size:14px; line-height:1.75\">\n        <li style=\"padding-bottom:14px\"><b>Run the SQL above.<\u002Fb> It creates a <code>leads<\u002Fcode> table alongside the two you already have.<\u002Fli>\n        <li style=\"padding-bottom:14px\"><b>Outlook rule.<\u002Fb> Rules → New rule → from <code>noreply@crexi.com<\u002Fcode> (repeat for the LoopNet sender) → Forward to the parser address you get in the next step.<\u002Fli>\n        <li style=\"padding-bottom:14px\"><b>Pick the middleman.<\u002Fb> <b>Power Automate<\u002Fb> is already in your Microsoft account and reads Outlook directly with no forwarding — but its HTTP action needs a premium licence. <b>Make.com<\u002Fb> or <b>Zapier<\u002Fb> both have an Outlook trigger and a free tier that covers a few hundred leads a month. Either way you want: trigger on the new mail, parse the body, then POST.<\u002Fli>\n        <li style=\"padding-bottom:14px\"><b>Teach it the shape.<\u002Fb> Feed it one real Crexi lead email and mark where the first name, last name, email, phone, listing address and action sit. Every later email of that shape parses itself.<\u002Fli>\n        <li style=\"padding-bottom:14px\"><b>Point the POST here.<\u002Fb> Values below — copy each one straight in.<\u002Fli>\n      <\u002Fol>\n\n      <div style=\"display:grid; gap:2px; background:#d5dce4; border:1px solid #d5dce4; margin-top:22px\">\n        <sc-for list=\"{{ wiring }}\" as=\"w\" hint-placeholder-count=\"4\">\n          <div style=\"background:#f5f7f9; padding:16px 18px\">\n            <div style=\"display:flex; gap:12px; align-items:baseline\">\n              <div style=\"font-size:11px; font-weight:800; letter-spacing:0.08em; color:#7b8798\">{{ w.label }}<\u002Fdiv>\n              <button sc-camel-on-click=\"{{ w.onCopy }}\" style=\"margin-left:auto; border:0; background:transparent; color:#2f6fad; font-weight:800; font-size:11.5px; letter-spacing:0.04em; cursor:pointer; padding:0\">{{ w.btn }}<\u002Fbutton>\n            <\u002Fdiv>\n            <pre style=\"margin:6px 0 0; white-space:pre-wrap; word-break:break-all; font-family:ui-monospace,monospace; font-size:12.5px; line-height:1.6\">{{ w.value }}<\u002Fpre>\n            <div style=\"font-size:12px; color:#5b6675; padding-top:6px\">{{ w.note }}<\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:13.5px; color:#5b6675; padding-top:22px; max-width:84ch\">The service role key bypasses row security, which is what lets an outside service write on your behalf. It belongs in Power Automate or Make and nowhere else — never in a page, never in the repo. Find it under Project Settings → API → service_role.<\u002Fdiv>\n      <div style=\"font-size:13.5px; color:#5b6675; padding-top:10px; max-width:84ch\">Addresses that don't match one of your six listings land in an <b>Unassigned<\u002Fb> column rather than being guessed onto the wrong board.<\u002Fdiv>\n    <\u002Fsection>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst HOT = [\"Requested Info\", \"Sent Message\", \"Sent Email\", \"Clicked Phone\", \"Clicked Email\", \"Saved Notes\"];\nconst WARM = [\"Viewed Space\", \"Opened Flyer\", \"Opened Brochure\", \"Saved Property\"];\n\n/* The board. Order is the pipeline, left to right; the last two are the ways a\n   name leaves it. Drag between columns writes the stage. */\nconst STAGES = [\n  { k: \"\", label: \"NEW\", color: \"#14243d\", bg: \"#f5f7f9\" },\n  { k: \"Viewed\", label: \"VIEWED PROPERTY\", color: \"#14243d\", bg: \"#f5f7f9\" },\n  { k: \"Sent\", label: \"BROCHURE SENT\", color: \"#2f6fad\", bg: \"#f5f7f9\" },\n  { k: \"Talking\", label: \"IN CONVERSATION\", color: \"#2f6fad\", bg: \"#eef3f8\" },\n  { k: \"Stalled\", label: \"NOT WORKING\", color: \"#7b8798\", bg: \"#f0f1f2\" },\n  { k: \"Dead\", label: \"DEAD LEAD\", color: \"#ec3013\", bg: \"#f0f1f2\" }\n];\n/* Anything written by the earlier version of this page still resolves. */\nconst LEGACY = { Called: \"Sent\", Emailed: \"Sent\", Talked: \"Talking\", Touring: \"Talking\", Offer: \"Talking\" };\n\nconst BROCHURES = {\n  bannock: \"brochures/1937-1955-s-bannock-st.pdf\",\n  f5380: \"brochures/5380-federal-blvd.pdf\",\n  f5450: \"brochures/5450-federal-blvd.pdf\",\n  shops6: \"brochures/14799-w-6th-ave.pdf\",\n  colfax: \"brochures/9797-w-colfax-ave.pdf\"\n};\n/* Where the brochures live once the page is published — a mailto can carry a\n   link but never an attachment, so the link has to be absolute. */\nconst SITE = \"https://digby-bpo.vercel.app/\";\n\nclass Component extends DCLogic {\n  state = {\n    view: \"home\", pid: \"\", pFilter: \"all\", person: \"\", back: \"home\",\n    st: { status: {}, notes: {}, log: [] },\n    bossEmail: \"\", copyBtn: \"COPY THE TEXT\", sqlBtn: \"COPY THE SQL\",\n    sbUrl: \"\", sbKey: \"\", sbEmail: \"\", sbPass: \"\", sbTok: \"\", sbUid: \"\", sbMsg: \"\",\n    live: [], liveAt: \"\", copiedKey: \"\"\n  };\n\n  componentDidMount() {\n    let st = { status: {}, notes: {}, log: [] };\n    try { st = JSON.parse(window.localStorage.getItem(\"digby-dash-v1\") || \"null\") || st; } catch (e) {}\n    if (!st.status) st.status = {};\n    if (!st.notes) st.notes = {};\n    if (!st.log) st.log = [];\n    let boss = \"\";\n    try { boss = window.localStorage.getItem(\"digby-boss\") || \"\"; } catch (e) {}\n    const c = this.cfg();\n    this.setState({ st: st, bossEmail: boss, sbUrl: c.url, sbKey: c.key, sbEmail: c.email, sbTok: c.tok, sbUid: c.uid });\n    if (c.tok && c.uid) {\n      setTimeout(() => this.pull(), 400);\n      setTimeout(() => this.fetchLive(), 700);\n      /* A dashboard that only updates on reload isn't live. */\n      this._live = setInterval(() => this.fetchLive(), 120000);\n    }\n  }\n  componentWillUnmount() { clearInterval(this._live); }\n\n  /* Crexi writes the same building three different ways, so a posted address is\n     normalised the same way the historical report was before it lands on a\n     board. Anything that doesn't resolve goes to Unassigned rather than being\n     guessed onto the wrong listing. */\n  pidFor(addr) {\n    const s = String(addr || \"\");\n    if (/bannock/i.test(s)) return \"bannock\";\n    if (/5380/.test(s)) return \"f5380\";\n    if (/5450/.test(s)) return \"f5450\";\n    if (/primrose/i.test(s)) return \"primrose\";\n    if (/9797|colfax/i.test(s)) return \"colfax\";\n    if (/14799|6th ave|6 ave|shops at 6/i.test(s)) return \"shops6\";\n    return \"unassigned\";\n  }\n\n  data() {\n    const base = window.DASH || { props: [], leads: [], broker: \"\" };\n    const live = this.state.live || [];\n    if (!live.length) return base;\n    const props = base.props.slice();\n    if (live.some(l => l.pid === \"unassigned\")) {\n      props.push({ id: \"unassigned\", name: \"Unassigned\", city: \"address didn't match a listing\", deal: \"Live feed\", price: \"\" });\n    }\n    /* A live row wins over the weekly export when it is the same touch. */\n    const seen = {};\n    live.forEach(l => { seen[l.pid + \"|\" + (l.e || l.n) + \"|\" + l.w] = 1; });\n    const merged = live.concat(base.leads.filter(l => !seen[l.pid + \"|\" + (l.e || l.n) + \"|\" + l.w]));\n    merged.sort((a, b) => b.w.localeCompare(a.w));\n    return { props: props, leads: merged, broker: base.broker };\n  }\n\n  async fetchLive() {\n    const c = this.cfg();\n    if (!c.url || !c.key || !c.tok || !c.uid) return;\n    const url = c.url + \"/rest/v1/leads?select=*&user_id=eq.\" + c.uid + \"&order=received_at.desc&limit=2000\";\n    try {\n      let r = await fetch(url, { headers: this.headers(c) });\n      if (r.status === 401) { const t = await this.refresh(); if (t) r = await fetch(url, { headers: this.headers(Object.assign({}, c, { tok: t })) }); }\n      if (!r.ok) return;\n      const rows = await r.json();\n      const live = (rows || []).map(r2 => ({\n        w: String(r2.week || r2.received_at || \"\").slice(0, 10),\n        p: r2.prop || \"\",\n        pid: this.pidFor(r2.prop),\n        n: [r2.name].filter(Boolean).join(\" \") || (r2.email || \"\"),\n        e: r2.email || \"\", ph: r2.phone || \"\",\n        s: r2.source || \"Live\", a: (r2.action || \"\").replace(/:$/, \"\").trim(),\n        m: r2.message || \"\"\n      })).filter(l => l.w);\n      this.setState({ live: live, liveAt: new Date().toLocaleTimeString() });\n    } catch (e) {}\n  }\n  leadId(l) { return l.pid + \"|\" + (l.e || l.n) + \"|\" + l.w; }\n  tier(a) { return HOT.indexOf(a) >= 0 ? \"hot\" : (WARM.indexOf(a) >= 0 ? \"warm\" : \"cold\"); }\n  weeks() {\n    const set = {};\n    this.data().leads.forEach(l => { set[l.w] = 1; });\n    return Object.keys(set).sort().reverse();\n  }\n  prettyWeek(w) {\n    if (!w) return \"\";\n    const p = w.split(\"-\");\n    return p[1].replace(/^0/, \"\") + \"/\" + p[2].replace(/^0/, \"\");\n  }\n\n  saveSt(st) {\n    try { window.localStorage.setItem(\"digby-dash-v1\", JSON.stringify(st)); } catch (e) {}\n    this.setState({ st: st });\n    this.queue();\n  }\n  /* Nothing that happens to a name is overwritten — every stage change, note and\n     brochure is appended to a log so the whole journey survives the next edit. */\n  withLog(st, entry) {\n    return {\n      status: st.status, notes: st.notes,\n      log: (st.log || []).concat([entry]).slice(-5000)\n    };\n  }\n  setStatus(id, v) {\n    const st = this.state.st;\n    const from = st.status[id] || \"\";\n    if (from === v) return;\n    const next = this.withLog(st, { id: id, t: new Date().toISOString(), k: \"stage\", from: from, to: v });\n    next.status = Object.assign({}, st.status, { [id]: v });\n    this.saveSt(next);\n  }\n  setNote(id, v) {\n    const st = this.state.st;\n    if ((st.notes[id] || \"\") === v) return;\n    const next = this.withLog(st, { id: id, t: new Date().toISOString(), k: \"note\", to: v });\n    next.notes = Object.assign({}, st.notes, { [id]: v });\n    this.saveSt(next);\n  }\n  personKey(l) { return String(l.e || l.n || \"\").toLowerCase().trim(); }\n  /* An update is an addition, never a replacement — each one is its own log row. */\n  addUpdate(id, text) {\n    const t = String(text || \"\").trim();\n    if (!t) return;\n    const st = this.state.st;\n    this.saveSt(this.withLog(st, { id: id, t: new Date().toISOString(), k: \"note\", to: t }));\n  }\n\n  stageOf(l) {\n    const raw = this.state.st.status[this.leadId(l)] || \"\";\n    return LEGACY[raw] !== undefined ? LEGACY[raw] : raw;\n  }\n  brochureUrl(pid, absolute) {\n    const path = BROCHURES[pid];\n    if (!path) return \"\";\n    if (!absolute) return path;\n    const base = /^https?:$/.test(window.location.protocol) ? window.location.href : SITE;\n    try { return new URL(path, base).href; } catch (e) { return SITE + path; }\n  }\n  sendBrochure(l, prop) {\n    const url = this.brochureUrl(l.pid, true);\n    /* No brochure on file means no email — sending a promise with a blank link\n       would be worse than not sending, and the stage must not move either. */\n    if (!url) return;\n    const name = (l.n || \"\").split(\" \")[0];\n    const body = [\n      (name ? name : \"Hello\") + \",\",\n      \"\",\n      \"Thanks for looking at \" + (prop.name || l.p) + (prop.city ? \" in \" + prop.city.replace(/^.*· /, \"\") : \"\") + \".\",\n      \"Here is the brochure with the full details:\",\n      url,\n      \"\",\n      \"Happy to walk you through it or set up a tour — just reply here or call me.\",\n      \"\",\n      \"Lucas Quinn\",\n      \"Associate Broker · Digby Commercial\",\n      \"978.460.5577 · Lucas@DigbyCommercial.com\"\n    ].join(\"\\n\");\n    /* A mail draft opened from a page can carry a link but never a file, so the\n       PDF is downloaded at the same moment — it lands in Downloads ready to drag\n       onto the message that just opened. */\n    const a = document.createElement(\"a\");\n    a.href = this.brochureUrl(l.pid, false);\n    a.download = (prop.name || \"brochure\").replace(/[^a-z0-9]+/gi, \"-\").toLowerCase() + \".pdf\";\n    a.rel = \"noopener\";\n    document.body.appendChild(a);\n    a.click();\n    setTimeout(() => a.remove(), 1000);\n\n    window.location.href = \"mailto:\" + encodeURIComponent(l.e || \"\")\n      + \"?subject=\" + encodeURIComponent((prop.name || l.p) + \" — brochure\")\n      + \"&body=\" + encodeURIComponent(body);\n\n    /* Sending is a stage change and a logged action, both without a second click. */\n    const id = this.leadId(l);\n    const day = new Date().toLocaleDateString(undefined, { month: \"numeric\", day: \"numeric\" });\n    const prior = this.state.st.notes[id] || \"\";\n    const line = \"Emailed brochure \" + day;\n    const stNow = this.state.st;\n    const next = this.withLog(stNow, { id: id, t: new Date().toISOString(), k: \"brochure\", to: l.e || \"\", pid: l.pid });\n    next.status = Object.assign({}, stNow.status, { [id]: \"Sent\" });\n    next.notes = Object.assign({}, stNow.notes, { [id]: prior.indexOf(line) >= 0 ? prior : (prior ? prior + \" · \" + line : line) });\n    this.saveSt(next);\n  }\n\n  /* ---------- the weekly note to the boss ---------- */\n  buildReport() {\n    const d = this.data();\n    const weeks = this.weeks();\n    const w = weeks[0], prev = weeks[1];\n    const cur = d.leads.filter(l => l.w === w);\n    const last = d.leads.filter(l => l.w === prev);\n    const hot = cur.filter(l => this.tier(l.a) === \"hot\");\n    const worked = cur.filter(l => this.state.st.status[this.leadId(l)]).length;\n    const L = [];\n    L.push(\"LISTING ACTIVITY — WEEK OF \" + w);\n    L.push(d.broker + \" · Digby Commercial\");\n    L.push(\"\");\n    L.push(cur.length + \" touches across \" + new Set(cur.map(l => l.pid)).size + \" listings\"\n      + (last.length ? \", against \" + last.length + \" the week before\" : \"\"));\n    L.push(hot.length + \" of them were people asking for something — a message, an information request, or a click straight to the phone or email\");\n    L.push(worked + \" have been worked so far\");\n    L.push(\"\");\n    L.push(\"BY LISTING\");\n    d.props.forEach(p => {\n      const mine = cur.filter(l => l.pid === p.id);\n      const all = d.leads.filter(l => l.pid === p.id);\n      if (!all.length) return;\n      const h = mine.filter(l => this.tier(l.a) === \"hot\").length;\n      L.push(\"  \" + p.name + \" — \" + mine.length + \" this week, \" + all.length + \" total\"\n        + (h ? \" · \" + h + \" asked for something\" : \"\"));\n    });\n    if (hot.length) {\n      L.push(\"\");\n      L.push(\"WORTH YOUR TIME\");\n      hot.forEach(l => {\n        const p = d.props.find(x => x.id === l.pid) || {};\n        const s = this.state.st.status[this.leadId(l)];\n        L.push(\"  \" + l.n + \" · \" + (p.name || l.p) + \" · \" + l.a + (s ? \" · \" + s : \" · not yet worked\"));\n        if (l.e) L.push(\"    \" + l.e + (l.ph ? \" · \" + l.ph : \"\"));\n        if (l.m) L.push(\"    \\u201c\" + String(l.m).replace(/\\s+/g, \" \").trim().slice(0, 220) + \"\\u201d\");\n      });\n    }\n    const notes = Object.keys(this.state.st.notes).filter(k => this.state.st.notes[k]);\n    if (notes.length) {\n      L.push(\"\");\n      L.push(\"WHAT I DID\");\n      notes.slice(0, 40).forEach(k => {\n        const l = d.leads.find(x => this.leadId(x) === k);\n        L.push(\"  \" + (l ? l.n + \" · \" : \"\") + this.state.st.notes[k]);\n      });\n    }\n    return L.join(\"\\n\");\n  }\n\n  /* ---------- supabase, same login as the other tools ---------- */\n  cfg() {\n    let c = {};\n    try { c = JSON.parse(window.localStorage.getItem(\"digby-sync\") || \"{}\") || {}; } catch (e) {}\n    return {\n      url: String(this.state.sbUrl || c.url || \"\").replace(/\\/+$/, \"\"),\n      key: this.state.sbKey || c.key || \"\",\n      email: this.state.sbEmail || c.email || \"\",\n      tok: this.state.sbTok || c.tok || \"\",\n      ref: c.ref || \"\",\n      uid: this.state.sbUid || c.uid || \"\"\n    };\n  }\n  store(patch) {\n    let c = {};\n    try { c = JSON.parse(window.localStorage.getItem(\"digby-sync\") || \"{}\") || {}; } catch (e) {}\n    const next = Object.assign({}, c, patch);\n    try { window.localStorage.setItem(\"digby-sync\", JSON.stringify(next)); } catch (e) {}\n    return next;\n  }\n  headers(c) { return { apikey: c.key, Authorization: \"Bearer \" + c.tok, \"Content-Type\": \"application/json\" }; }\n\n  async signIn() {\n    const c = this.cfg();\n    const email = (this.state.sbEmail || c.email || \"\").trim();\n    const pass = this.state.sbPass || \"\";\n    if (!c.url || !c.key) return this.setState({ sbMsg: \"Paste the project URL and the anon key first.\" });\n    if (!email || !pass) return this.setState({ sbMsg: \"Email and password, please.\" });\n    this.setState({ sbMsg: \"Signing in\\u2026\" });\n    try {\n      const r = await fetch(c.url + \"/auth/v1/token?grant_type=password\", {\n        method: \"POST\", headers: { apikey: c.key, \"Content-Type\": \"application/json\" },\n        body: JSON.stringify({ email: email, password: pass })\n      });\n      const j = await r.json();\n      if (!r.ok || !j.access_token) throw new Error(j.error_description || j.msg || j.error || \"sign-in refused\");\n      this.store({ url: c.url, key: c.key, email: email, tok: j.access_token, ref: j.refresh_token || \"\", uid: j.user && j.user.id });\n      this.setState({ sbTok: j.access_token, sbUid: (j.user || {}).id || \"\", sbPass: \"\", sbMsg: \"Signed in.\" });\n      await this.pull();\n    } catch (e) { this.setState({ sbMsg: \"Couldn't sign in: \" + e.message }); }\n  }\n  signOut() { this.store({ tok: \"\", ref: \"\", uid: \"\" }); this.setState({ sbTok: \"\", sbUid: \"\", sbMsg: \"Signed out.\" }); }\n  async refresh() {\n    const c = this.cfg();\n    if (!c.url || !c.key || !c.ref) return \"\";\n    try {\n      const r = await fetch(c.url + \"/auth/v1/token?grant_type=refresh_token\", {\n        method: \"POST\", headers: { apikey: c.key, \"Content-Type\": \"application/json\" },\n        body: JSON.stringify({ refresh_token: c.ref })\n      });\n      const j = await r.json();\n      if (!r.ok || !j.access_token) return \"\";\n      this.store({ tok: j.access_token, ref: j.refresh_token || c.ref });\n      this.setState({ sbTok: j.access_token });\n      return j.access_token;\n    } catch (e) { return \"\"; }\n  }\n  async pull() {\n    const c = this.cfg();\n    if (!c.url || !c.key || !c.tok || !c.uid) return;\n    const url = c.url + \"/rest/v1/dash_state?select=data&user_id=eq.\" + c.uid;\n    try {\n      let r = await fetch(url, { headers: this.headers(c) });\n      if (r.status === 401) { const t = await this.refresh(); if (t) r = await fetch(url, { headers: this.headers(Object.assign({}, c, { tok: t })) }); }\n      if (!r.ok) throw new Error(\"HTTP \" + r.status);\n      const rows = await r.json();\n      const remote = rows && rows[0] && rows[0].data;\n      if (!remote) return this.push(true);\n      const merged = {\n        status: Object.assign({}, remote.status || {}, this.state.st.status),\n        notes: Object.assign({}, remote.notes || {}, this.state.st.notes),\n        log: []\n      };\n      /* Two devices both append, so the log is unioned rather than replaced. */\n      const seenEv = {};\n      (remote.log || []).concat(this.state.st.log || []).forEach(e => {\n        const k = e.t + \"|\" + e.id + \"|\" + e.k;\n        if (seenEv[k]) return;\n        seenEv[k] = 1;\n        merged.log.push(e);\n      });\n      merged.log.sort((a, b) => String(a.t).localeCompare(String(b.t)));\n      try { window.localStorage.setItem(\"digby-dash-v1\", JSON.stringify(merged)); } catch (e) {}\n      this.setState({ st: merged, sbMsg: \"Pulled \" + Object.keys(merged.status).length + \" statuses.\" });\n      this.push(true);\n    } catch (e) { this.setState({ sbMsg: \"Sync trouble: \" + e.message }); }\n  }\n  async push(quiet) {\n    const c = this.cfg();\n    if (!c.url || !c.key || !c.tok || !c.uid) return;\n    const body = JSON.stringify([{ user_id: c.uid, data: this.state.st }]);\n    const send = cfg => fetch(cfg.url + \"/rest/v1/dash_state?on_conflict=user_id\", {\n      method: \"POST\",\n      headers: Object.assign({}, this.headers(cfg), { Prefer: \"resolution=merge-duplicates,return=minimal\" }),\n      body: body\n    });\n    try {\n      let r = await send(c);\n      if (r.status === 401) { const t = await this.refresh(); if (t) r = await send(Object.assign({}, c, { tok: t })); }\n      if (!r.ok) throw new Error(\"HTTP \" + r.status);\n      if (!quiet) this.setState({ sbMsg: \"Saved up.\" });\n    } catch (e) { this.setState({ sbMsg: \"Couldn't save up: \" + e.message }); }\n  }\n  queue() {\n    const c = this.cfg();\n    if (!c.tok || !c.uid) return;\n    clearTimeout(this._t);\n    this._t = setTimeout(() => this.push(true), 1400);\n  }\n\n  renderVals() {\n    const st = this.state, d = this.data();\n    const view = st.view;\n    const lab = (k, t, n) => (view === k ? \"\\u25b8 \" : \"\") + t + (n ? \" \\u00b7 \" + n : \"\");\n    const weeks = this.weeks();\n    const wNow = weeks[0], wPrev = weeks[1];\n    const recent = weeks.slice(0, 10).reverse();\n    const statusOf = l => this.stageOf(l);\n    const aColor = a => this.tier(a) === \"hot\" ? \"#ec3013\" : (this.tier(a) === \"warm\" ? \"#14243d\" : \"#7b8798\");\n    const mailto = l => \"mailto:\" + (l.e || \"\") + \"?subject=\" + encodeURIComponent(l.p + \" — following up\") ;\n\n    const curLeads = d.leads.filter(l => l.w === wNow);\n    const prevLeads = d.leads.filter(l => l.w === wPrev);\n    const hotAll = d.leads.filter(l => this.tier(l.a) === \"hot\").sort((a, b) => b.w.localeCompare(a.w));\n    const hotNow = curLeads.filter(l => this.tier(l.a) === \"hot\");\n    const unworked = hotAll.filter(l => !statusOf(l)).length;\n    const delta = prevLeads.length ? curLeads.length - prevLeads.length : 0;\n\n    const kpis = [\n      { label: \"TOUCHES THIS WEEK\", value: String(curLeads.length), sub: wPrev ? (delta >= 0 ? \"+\" : \"\") + delta + \" against last week\" : \"week of \" + wNow },\n      { label: \"ASKED FOR SOMETHING\", value: String(hotNow.length), sub: \"of \" + curLeads.length + \" touches\" },\n      { label: \"HOT, NEVER WORKED\", value: String(unworked), sub: \"across every week\" },\n      { label: \"TOUCHES ALL TIME\", value: String(d.leads.length), sub: weeks.length + \" weeks on file\" },\n      { label: \"LISTINGS LIVE\", value: String(d.props.length), sub: \"under your name\" }\n    ];\n\n    const cards = d.props.map(p => {\n      const mine = d.leads.filter(l => l.pid === p.id);\n      const perWeek = recent.map(w => mine.filter(l => l.w === w).length);\n      const top = Math.max.apply(null, perWeek.concat([1]));\n      return {\n        onClick: () => this.setState({ view: \"prop\", pid: p.id, pFilter: \"all\" }),\n        deal: p.deal, price: p.price, name: p.name, city: p.city,\n        total: String(mine.length),\n        week: String(mine.filter(l => l.w === wNow).length),\n        hot: String(mine.filter(l => this.tier(l.a) === \"hot\").length),\n        open: String(mine.filter(l => this.tier(l.a) === \"hot\" && !statusOf(l)).length),\n        bars: recent.map((w, i) => ({\n          h: Math.max(2, Math.round(perWeek[i] / top * 46)),\n          color: w === wNow ? \"#2f6fad\" : \"#c3ccd6\",\n          title: this.prettyWeek(w) + \" · \" + perWeek[i]\n        }))\n      };\n    });\n\n    /* property page */\n    const p = d.props.find(x => x.id === st.pid) || {};\n    const mine = d.leads.filter(l => l.pid === st.pid);\n    const shown = mine.filter(l => {\n      if (st.pFilter === \"hot\") return this.tier(l.a) === \"hot\";\n      if (st.pFilter === \"open\") return !statusOf(l);\n      return true;\n    });\n    const rowOf = l => {\n      const id = this.leadId(l);\n      return {\n        w: this.prettyWeek(l.w), n: l.n || \"—\", e: l.e || \"\", ph: l.ph || \"\",\n        s: l.s || \"—\", a: l.a || \"—\", aColor: aColor(l.a),\n        m: l.m ? String(l.m).replace(/\\s+/g, \" \").trim() : \"\",\n        mailto: mailto(l),\n        status: statusOf(l),\n        note: st.st.notes[id] || \"\",\n        onStatus: e => this.setStatus(id, e.target.value),\n        onNote: e => this.setNote(id, e.target.value),\n        pname: (d.props.find(x => x.id === l.pid) || {}).name || l.p,\n        onProp: () => this.setState({ view: \"prop\", pid: l.pid, pFilter: \"all\" }),\n        onOpen: () => this.setState({ view: \"lead\", person: this.personKey(l), back: view })\n      };\n    };\n\n    const board = STAGES.map(s => {\n      const cards = mine.filter(l => this.stageOf(l) === s.k);\n      return {\n        label: s.label, color: s.color, bg: s.bg, count: String(cards.length),\n        empty: cards.length === 0,\n        hint: cards.length ? \"drag a row onto another heading to move it\" : \"\",\n        onDragOver: e => e.preventDefault(),\n        onDrop: e => {\n          e.preventDefault();\n          const id = e.dataTransfer.getData(\"text/plain\") || this._drag;\n          if (id) this.setStatus(id, s.k);\n        },\n        cards: cards.map(l => {\n          const id = this.leadId(l);\n          const row = rowOf(l);\n          return Object.assign(row, {\n            onDragStart: e => {\n              this._drag = id;\n              try { e.dataTransfer.setData(\"text/plain\", id); e.dataTransfer.effectAllowed = \"move\"; } catch (err) {}\n            },\n            onDragEnd: () => { this._drag = \"\"; },\n            tel: l.ph ? \"tel:\" + String(l.ph).replace(/[^0-9+]/g, \"\") : \"#\",\n            hasBrochure: !!BROCHURES[l.pid],\n            sendBrochure: () => this.sendBrochure(l, p)\n          });\n        })\n      };\n    });\n\n    const pHot = mine.filter(l => this.tier(l.a) === \"hot\").length;\n    const pKpis = [\n      { label: \"TOUCHES\", value: String(mine.length), sub: \"since \" + (mine.length ? this.prettyWeek(mine[mine.length - 1].w) : \"—\") },\n      { label: \"THIS WEEK\", value: String(mine.filter(l => l.w === wNow).length), sub: \"week of \" + wNow },\n      { label: \"ASKED FOR SOMETHING\", value: String(pHot), sub: \"message, info request or click-to-call\" },\n      { label: \"UNIQUE PEOPLE\", value: String(new Set(mine.map(l => (l.e || l.n).toLowerCase())).size), sub: \"distinct contacts\" }\n    ];\n\n    /* ---------- one person, everything that ever happened ---------- */\n    const stageLabel = k => {\n      const key = LEGACY[k] !== undefined ? LEGACY[k] : (k || \"\");\n      const s = STAGES.find(x => x.k === key);\n      return s ? s.label.charAt(0) + s.label.slice(1).toLowerCase() : \"New\";\n    };\n    const propName = pid => (d.props.find(x => x.id === pid) || {}).name || pid;\n    const stamp = t => {\n      try {\n        return new Date(t).toLocaleString(undefined, { month: \"numeric\", day: \"numeric\", hour: \"numeric\", minute: \"2-digit\" });\n      } catch (e) { return String(t).slice(0, 16); }\n    };\n\n    const touches = d.leads.filter(l => this.personKey(l) === st.person)\n      .sort((a, b) => b.w.localeCompare(a.w));\n    const who = touches[0] || {};\n    const mineIds = {};\n    touches.forEach(l => { mineIds[this.leadId(l)] = l; });\n\n    const timeline = [];\n    touches.forEach(l => timeline.push({\n      srt: l.w + \"T00:00:00\", when: this.prettyWeek(l.w), side: \"THEY DID\",\n      sideColor: aColor(l.a), rule: aColor(l.a),\n      title: l.a || \"Touch\", where: propName(l.pid), src: l.s || \"\",\n      body: l.m ? String(l.m).replace(/\\s+/g, \" \").trim() : \"\"\n    }));\n    (st.st.log || []).forEach(e => {\n      const l = mineIds[e.id];\n      if (!l) return;\n      if (e.k === \"note\" && !String(e.to || \"\").trim()) return;\n      timeline.push({\n        srt: e.t, when: stamp(e.t), side: \"I DID\", sideColor: \"#2f6fad\", rule: \"#2f6fad\",\n        title: e.k === \"stage\" ? \"Moved to \" + stageLabel(e.to)\n          : e.k === \"brochure\" ? \"Emailed the brochure\" : \"Noted\",\n        where: propName(l.pid), src: \"\",\n        body: e.k === \"note\" ? e.to : (e.k === \"stage\" && e.from ? \"was \" + stageLabel(e.from) : \"\")\n      });\n    });\n    timeline.sort((a, b) => String(b.srt).localeCompare(String(a.srt)));\n\n    const byProp = {};\n    touches.forEach(l => {\n      const k = l.pid;\n      if (!byProp[k]) byProp[k] = { pid: k, name: propName(k), n: 0, last: l };\n      byProp[k].n++;\n    });\n    const leadListings = Object.keys(byProp).map(k => {\n      const b = byProp[k];\n      const id = this.leadId(b.last);\n      return {\n        name: b.name, n: b.n + (b.n === 1 ? \" touch\" : \" touches\"),\n        stage: this.stageOf(b.last),\n        onStatus: e => this.setStatus(id, e.target.value),\n        onProp: () => this.setState({ view: \"prop\", pid: b.pid, pFilter: \"all\" })\n      };\n    });\n\n    const myEvents = timeline.filter(t => t.side === \"I DID\").length;\n    const leadKpis = [\n      { label: \"TOUCHES\", value: String(touches.length), sub: \"across \" + leadListings.length + (leadListings.length === 1 ? \" listing\" : \" listings\") },\n      { label: \"ASKED FOR SOMETHING\", value: String(touches.filter(l => this.tier(l.a) === \"hot\").length), sub: \"message, info request or click\" },\n      { label: \"THINGS I DID\", value: String(myEvents), sub: myEvents ? \"logged here\" : \"nothing logged yet\" },\n      { label: \"FIRST SEEN\", value: touches.length ? this.prettyWeek(touches[touches.length - 1].w) : \"—\", sub: touches.length ? \"last \" + this.prettyWeek(touches[0].w) : \"\" }\n    ];\n\n    const report = this.buildReport();\n\n    const c = this.cfg();\n    const on = !!(c.tok && c.uid);\n\n    return {\n      brokerLine: d.broker ? d.broker.toUpperCase() + \" \\u00b7 DIGBY COMMERCIAL\" : \"DIGBY COMMERCIAL\",\n      syncLine: on ? \"Syncing as \" + (c.email || \"you\") : \"This browser only \\u00b7 connect on the sync tab\",\n      isHome: view === \"home\", isProp: view === \"prop\", isHot: view === \"hot\", isReport: view === \"report\", isSync: view === \"sync\",\n      isLead: view === \"lead\",\n      leadName: who.n || \"—\",\n      leadEmail: who.e || \"\",\n      leadMail: who.e ? mailto(who) : \"#\",\n      leadPhone: who.ph || \"no phone on file\",\n      leadTel: who.ph ? \"tel:\" + String(who.ph).replace(/[^0-9+]/g, \"\") : \"#\",\n      leadKpis: leadKpis,\n      leadListings: leadListings,\n      leadTimeline: timeline,\n      leadEmpty: timeline.length === 0,\n      draft: st.draft || \"\",\n      draftAt: touches.length ? propName(touches[0].pid) : \"\",\n      onDraft: e => this.setState({ draft: e.target.value }),\n      onLogUpdate: () => {\n        if (!touches.length) return;\n        this.addUpdate(this.leadId(touches[0]), st.draft);\n        this.setState({ draft: \"\" });\n      },\n      onDraftKey: e => {\n        if (e.key === \"Enter\" && (e.metaKey || e.ctrlKey)) {\n          if (!touches.length) return;\n          this.addUpdate(this.leadId(touches[0]), st.draft);\n          this.setState({ draft: \"\" });\n        }\n      },\n      leadBack: st.back === \"prop\" ? \"← BACK TO THE LISTING\" : st.back === \"hot\" ? \"← BACK TO HOT LEADS\" : \"← BACK\",\n      goBack: () => this.setState({ view: st.back || \"home\" }),\n      labHome: lab(\"home\", \"PROPERTIES\", d.props.length),\n      labHot: lab(\"hot\", \"HOT LEADS\", hotAll.length),\n      labReport: lab(\"report\", \"BOSS UPDATE\", 0),\n      goHome: () => this.setState({ view: \"home\" }),\n      goHot: () => this.setState({ view: \"hot\" }),\n      goReport: () => this.setState({ view: \"report\" }),\n      goSync: () => this.setState({ view: \"sync\" }),\n\n      kpis: kpis,\n      cards: cards,\n      homeNote: \"Every touch \" + (d.broker || \"you\") + \" logged on Crexi, CoStar and LoopNet, week of \"\n        + (weeks[weeks.length - 1] || \"\") + \" through \" + wNow + \". Click a listing to work it.\",\n\n      pName: p.name || \"\", pCity: p.city || \"\", pDeal: p.deal || \"\", pPrice: p.price || \"\", pTeam: p.team || \"\",\n      pFacts: (p.facts || []).map(f => ({ k: f[0], v: f[1] })),\n      pKpis: pKpis,\n      pLeads: shown.map(rowOf),\n      pFilter: st.pFilter,\n      onPFilter: e => this.setState({ pFilter: e.target.value }),\n      pCount: mine.length + \" names on this listing\",\n      board: board,\n      pBrochure: this.brochureUrl(st.pid, false) || \"#\",\n      pBrochureLabel: BROCHURES[st.pid] ? \"OPEN THE BROCHURE PDF\" : \"NO BROCHURE ON FILE\",\n\n      stageOpts: STAGES.map(s => ({ v: s.k, t: s.label.charAt(0) + s.label.slice(1).toLowerCase() })),\n      hotLeads: hotAll.map(rowOf),\n      hotCount: hotAll.length + \" people asked for something \\u00b7 \" + unworked + \" still marked New\",\n\n      reportText: report,\n      bossEmail: st.bossEmail,\n      onBoss: e => {\n        this.setState({ bossEmail: e.target.value });\n        try { window.localStorage.setItem(\"digby-boss\", e.target.value); } catch (err) {}\n      },\n      openMail: () => {\n        const subj = \"Listing activity — week of \" + wNow;\n        window.location.href = \"mailto:\" + encodeURIComponent(st.bossEmail || \"\")\n          + \"?subject=\" + encodeURIComponent(subj) + \"&body=\" + encodeURIComponent(report);\n      },\n      copyBtn: st.copyBtn,\n      copyReport: async () => {\n        try { await navigator.clipboard.writeText(report); this.setState({ copyBtn: \"COPIED\" }); }\n        catch (e) { this.setState({ copyBtn: \"COPY FAILED — SELECT IT BELOW\" }); }\n        setTimeout(() => this.setState({ copyBtn: \"COPY THE TEXT\" }), 3000);\n      },\n      printPage: () => window.print(),\n\n      sbOn: on, sbOff: !on,\n      sbUrl: st.sbUrl, sbKey: st.sbKey, sbEmail: st.sbEmail, sbPass: st.sbPass,\n      onSbUrl: e => this.setState({ sbUrl: e.target.value }),\n      onSbKey: e => this.setState({ sbKey: e.target.value }),\n      onSbEmail: e => this.setState({ sbEmail: e.target.value }),\n      onSbPass: e => this.setState({ sbPass: e.target.value }),\n      sbSignIn: () => this.signIn(),\n      sbSignOut: () => this.signOut(),\n      sbPushNow: () => this.push(false),\n      sbPullNow: () => { this.pull(); this.fetchLive(); },\n      liveStatus: !on\n        ? \"Connect above first — the feed needs your project URL and login.\"\n        : (st.live.length\n          ? st.live.length + \" live leads picked up\" + (st.liveAt ? \" · last checked \" + st.liveAt : \"\")\n          : \"Connected, table empty so far. Nothing has been posted in yet.\"),\n      wiring: [\n        { label: \"METHOD AND URL\", value: \"POST  \" + (c.url || \"https://YOUR-PROJECT.supabase.co\") + \"/rest/v1/leads\",\n          note: c.url ? \"\" : \"Sign in above and this fills in with your real project.\" },\n        { label: \"HEADERS\", value: [\n            \"apikey: <YOUR SERVICE ROLE KEY>\",\n            \"Authorization: Bearer <YOUR SERVICE ROLE KEY>\",\n            \"Content-Type: application/json\",\n            \"Prefer: resolution=ignore-duplicates\"\n          ].join(\"\\n\"),\n          note: \"The ignore-duplicates line is what stops the same lead landing twice if an email is re-sent.\" },\n        { label: \"JSON BODY\", value: JSON.stringify({\n            user_id: c.uid || \"<YOUR USER ID>\",\n            week: \"{{date of the email, YYYY-MM-DD}}\",\n            prop: \"{{listing address from the email}}\",\n            name: \"{{first}} {{last}}\",\n            email: \"{{their email}}\",\n            phone: \"{{their phone}}\",\n            source: \"Crexi\",\n            action: \"{{what they did}}\",\n            message: \"{{their message, if any}}\"\n          }, null, 2),\n          note: \"Replace each {{…}} with the field your parser pulled out. user_id is already yours — leave it as it is.\" },\n        { label: \"TEST IT\", value: \"Send yourself one Crexi lead email, let the rule fire, then press PULL DOWN above.\",\n          note: \"A row that arrives with an address matching one of your listings appears on that board within two minutes.\" }\n      ].map((w, i) => ({\n        label: w.label, value: w.value, note: w.note,\n        btn: st.copiedKey === \"w\" + i ? \"COPIED\" : \"COPY\",\n        onCopy: async () => {\n          try {\n            await navigator.clipboard.writeText(w.value);\n            this.setState({ copiedKey: \"w\" + i });\n            setTimeout(() => this.setState({ copiedKey: \"\" }), 2500);\n          } catch (e) {}\n        }\n      })),\n      sbMsg: st.sbMsg,\n      sqlBtn: st.sqlBtn,\n      copySql: async () => {\n        try {\n          const r = await fetch(\"supabase-leasing-schema.sql\");\n          await navigator.clipboard.writeText(await r.text());\n          this.setState({ sqlBtn: \"COPIED \\u2014 PASTE IT INTO SUPABASE\" });\n        } catch (e) { this.setState({ sqlBtn: \"COPY FAILED \\u2014 OPEN supabase-leasing-schema.sql\" }); }\n        setTimeout(() => this.setState({ sqlBtn: \"COPY THE SQL\" }), 4000);\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
